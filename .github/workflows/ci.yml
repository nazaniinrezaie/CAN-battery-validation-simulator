name: CAN Battery Validation CI

on:
  push:
  pull_request:

jobs:
  battery-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run battery tests
        run: python3 src/test_runner.py